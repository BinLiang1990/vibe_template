name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run smoke tests
        run: |
          for f in scripts/test-*.sh; do
            [ -e "$f" ] || continue
            bash "$f"
          done
