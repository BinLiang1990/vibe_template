name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: |
          for f in scripts/test-*.sh; do
            [ -e "$f" ] || continue
            bash "$f"
          done
